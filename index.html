<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dive Within">
<meta name="description" content="Twice a day, twenty minutes. A meditation timer and practice log in the spirit of Maharishi Mahesh Yogi and David Lynch.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Dive Within</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,200..800;1,62..125,200..800&display=swap">
<style>
/* Layout: a 1970s instruction card. A strict column, flat colour, one diagram of the mind as an ocean (surface to source), one marigold point that sinks and rises. Day palette before 3 pm, ink palette after. */
:root {
  --paper: #e4e6e1;
  --ink: #1a2132;
  --muted: #646b7a;
  --line: rgba(26, 33, 50, 0.16);
  --sun: #dd9227;
  --panel: rgba(26, 33, 50, 0.05);
  --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
:root[data-sky="night"] {
  --paper: #151b29;
  --ink: #e2e3dd;
  --muted: #8b91a0;
  --line: rgba(226, 227, 221, 0.14);
  --sun: #e8a23a;
  --panel: rgba(226, 227, 221, 0.05);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-stretch: 100%; font-weight: 400; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background-color 1.5s, color 1.5s; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
a { color: inherit; text-decoration-color: var(--sun); text-decoration-thickness: 2px; text-underline-offset: 3px; }
p { margin: 0; }
.small { font-size: 0.78rem; font-stretch: 85%; letter-spacing: 0.02em; color: var(--muted); }
.caps { font-size: 0.72rem; font-stretch: 110%; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }

.app {
  min-height: 100%; max-width: 460px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 84px);
  display: flex; flex-direction: column; gap: 0;
}
.mast { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.mast .name { font-weight: 800; font-stretch: 125%; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; }
.mast .date { font-size: 0.78rem; font-stretch: 85%; color: var(--muted); text-align: right; }
.subrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0 0; }

.view { animation: in 0.7s ease both; }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }

/* home */
.home { display: flex; flex-direction: column; gap: 20px; padding-top: 22px; }
.title-row { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; }
.title { margin: 0; font-weight: 300; font-stretch: 112%; font-size: 3rem; line-height: 0.95; letter-spacing: -0.02em; }
.mins { text-align: right; }
.mins b { display: block; font-weight: 200; font-stretch: 62%; font-size: 4.2rem; line-height: 0.82; font-variant-numeric: tabular-nums; }
.when { font-size: 0.95rem; color: var(--muted); }

.diagram { position: relative; }
.diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
.lvl-label { font-family: var(--font); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 5px; }
.lvl-line { stroke: var(--ink); stroke-opacity: 0.22; stroke-width: 0.6; }
.lvl-line.edge { stroke-opacity: 1; stroke-width: 1.2; }
.dot { fill: var(--sun); }

.begin { display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; background: var(--ink); color: var(--paper); padding: 18px 20px; font-weight: 600; font-stretch: 115%; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; }
.begin .arrow { font-weight: 300; font-size: 1.3rem; line-height: 1; }
.begin:active { opacity: 0.85; }

.controls { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.ctl { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; }
.ctl + .ctl { border-left: 1px solid var(--line); padding-left: 14px; }
.seg { display: flex; gap: 2px; flex-wrap: wrap; }
.seg button { font-size: 0.88rem; padding: 4px 8px 4px 0; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.sq { width: 9px; height: 9px; border: 1.2px solid currentColor; box-sizing: border-box; display: inline-block; }
.sq.on { background: var(--sun); border-color: var(--sun); }

.teaching { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.teaching .text { font-size: 1.15rem; font-weight: 300; font-stretch: 100%; line-height: 1.4; text-wrap: pretty; }
.teaching .who { font-size: 0.8rem; color: var(--muted); }
.teaching .sealed { font-size: 0.95rem; color: var(--muted); }
.teaching .title-s { font-weight: 500; font-stretch: 105%; font-size: 1.15rem; }
.teaching .sealed a { color: var(--ink); }
button.bead { padding: 0; cursor: pointer; }
.bead.sel { outline: 2px solid var(--sun); outline-offset: 2px; }
.lesson { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--panel); border-left: 3px solid var(--sun); }
.lesson h4 { margin: 0; font-weight: 500; font-stretch: 105%; font-size: 1.35rem; line-height: 1.2; text-wrap: balance; }
.lesson .text { font-size: 1.05rem; font-weight: 300; line-height: 1.5; }
.lesson-nav { display: flex; justify-content: space-between; padding-top: 6px; }
.lesson-nav button { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 0; }
.lesson-nav button:disabled { opacity: 0.25; cursor: default; }
.after .gift .g-ch, .after .gift .g-t, .after .gift .g-s { display: block; }
.after .gift .g-ch { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8b91a0; margin-bottom: 6px; }
.after .gift .g-t { font-weight: 500; font-size: 1.3rem; color: #e2e3dd; margin-bottom: 4px; }
.after .gift .g-s { font-size: 0.8rem; color: #8b91a0; margin-top: 8px; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 2px solid var(--ink);
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px)); transition: background-color 1.5s; }
.nav-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav a { text-decoration: none; text-align: center; padding: 14px 0 16px; font-size: 0.74rem; font-stretch: 100%; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-top: 4px solid transparent; margin-top: -2px; }
.nav a[aria-current="page"] { color: var(--ink); border-top-color: var(--sun); }

/* pages */
.page { display: flex; flex-direction: column; gap: 22px; padding-top: 22px; }
.page h2 { margin: 0; font-weight: 300; font-stretch: 112%; font-size: 2.4rem; line-height: 1; letter-spacing: -0.02em; }
.page h3 { margin: 0; font-weight: 600; font-stretch: 110%; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; padding-top: 14px; border-top: 2px solid var(--ink); }

/* guide */
.card { display: flex; flex-direction: column; gap: 16px; min-height: 50vh; }
.card .num { font-weight: 200; font-stretch: 62%; font-size: 5rem; line-height: 0.8; color: var(--sun); font-variant-numeric: tabular-nums; }
.card h4 { margin: 0; font-weight: 400; font-stretch: 112%; font-size: 1.9rem; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
.card p { font-size: 1.02rem; max-width: 38ch; }
.card .note { color: var(--muted); padding-left: 12px; border-left: 2px solid var(--sun); }
.guide-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.guide-nav button { padding: 10px 0; font-weight: 600; font-stretch: 110%; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
.guide-nav #gNext { justify-self: end; }
.guide-nav button:disabled { opacity: 0.25; cursor: default; }
.ticks { display: flex; gap: 4px; }
.ticks span { width: 14px; height: 3px; background: var(--line); }
.ticks span.on { background: var(--ink); }
.solid { background: var(--ink); color: var(--paper); padding: 14px 18px; font-weight: 600; font-stretch: 115%; font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase; align-self: flex-start; }

/* practice */
.mala-head { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end; }
.mala-head b { font-weight: 200; font-stretch: 62%; font-size: 5.6rem; line-height: 0.78; font-variant-numeric: tabular-nums; }
.beads { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
.bead { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1.2px solid var(--line); box-sizing: border-box; }
.bead.on { background: var(--ink); border-color: var(--ink); }
.bead.last { background: var(--sun); border-color: var(--sun); }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.figs div { padding: 12px 0; display: flex; flex-direction: column; gap: 2px; }
.figs div + div { border-left: 1px solid var(--line); padding-left: 12px; }
.figs b { font-weight: 300; font-stretch: 75%; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.grid-wrap { overflow-x: auto; }
.days { display: grid; grid-template-columns: repeat(21, 1fr); gap: 3px; min-width: 290px; }
.day { display: flex; flex-direction: column; gap: 3px; }
.cell { aspect-ratio: 1; background: var(--panel); border: 1px solid var(--line); box-sizing: border-box; }
.cell.on { background: var(--ink); border-color: var(--ink); }
.day.today .cell { border-color: var(--sun); }
.day-label { font-size: 0.6rem; color: var(--muted); min-height: 1em; font-variant-numeric: tabular-nums; }
.today-row { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.85rem; color: var(--muted); }
.today-row button { text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.times label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.times input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 0; padding: 10px; font: inherit; font-size: 16px; min-width: 0; }
.catch { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.catch li { display: grid; grid-template-columns: 4.6rem 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.catch .what { font-weight: 300; font-size: 1.05rem; line-height: 1.4; overflow-wrap: anywhere; min-width: 0; }

/* music */
.tracks { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.track { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.track .t-name { font-size: 1.15rem; font-weight: 400; font-stretch: 105%; }
.track .t-meta { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track[aria-pressed="true"] .t-name { font-weight: 600; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.row input[type=range] { flex: 1; min-width: 140px; accent-color: var(--sun); }
.outline { border: 1.5px solid var(--ink); padding: 10px 16px; font-weight: 600; font-stretch: 110%; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
.choice { display: grid; grid-template-columns: auto 1fr; gap: 10px; text-align: left; padding: 10px 0; }
.choice .sq { margin-top: 5px; }
.choice small { display: block; color: var(--muted); font-size: 0.85rem; }
.credits { font-size: 0.78rem; color: var(--muted); }

/* session — always the ink palette */
.session { position: fixed; inset: 0; z-index: 30; background: #10141f; color: #e2e3dd;
  display: grid; grid-template-rows: auto 1fr auto; gap: 18px;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(22px, env(safe-area-inset-left, 0px)); }
.session .inner { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.session .head { display: flex; justify-content: space-between; gap: 10px; font-size: 0.75rem; font-stretch: 110%; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8b91a0; border-bottom: 1px solid rgba(226,227,221,0.25); padding-bottom: 10px; transition: opacity 3s; }
.session .diagram { flex: 1; display: flex; align-items: center; min-height: 0; }
.session .diagram svg { max-height: 52vh; }
.session .lvl-line { stroke: #e2e3dd; }
.session .lvl-label { fill: #6f7585; stroke: #10141f; }
.session .words { font-size: 1.25rem; font-weight: 300; line-height: 1.35; text-wrap: balance; transition: opacity 3s; min-height: 3.4em; }
.session.dim .words, .session.dim .head { opacity: 0.12; }
.s-actions { display: flex; justify-content: space-between; gap: 12px; font-size: 0.78rem; font-stretch: 110%; letter-spacing: 0.1em; text-transform: uppercase; color: #8b91a0; }
.s-actions button { color: #8b91a0; padding: 8px 0; }
.after { display: flex; flex-direction: column; gap: 14px; }
.after .bead-line { display: flex; align-items: baseline; gap: 10px; }
.after .bead-line b { font-weight: 200; font-stretch: 62%; font-size: 4.2rem; line-height: 0.8; color: #e8a23a; }
.after .gift { font-size: 1.15rem; font-weight: 300; line-height: 1.4; padding-left: 12px; border-left: 2px solid #e8a23a; }
.after label { font-size: 0.85rem; color: #8b91a0; }
.after textarea { width: 100%; box-sizing: border-box; min-height: 80px; resize: vertical; background: rgba(226,227,221,0.06); color: #e2e3dd; border: 1px solid rgba(226,227,221,0.2); padding: 12px; font: inherit; font-size: 16px; }
.after .solid { background: #e2e3dd; color: #10141f; align-self: stretch; text-align: center; }

@media (prefers-reduced-motion: reduce) { .view { animation: none; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <div class="mast"><span class="name">Dive Within</span><span class="date" id="dateLine"></span></div>
    <div class="subrow small"><span id="beadMini"></span><span id="numberLine"></span></div>
  </header>

  <section class="home view" id="view-home">
    <div class="title-row">
      <h1 class="title" id="title">Morning</h1>
      <div class="mins"><b id="minsBig">20</b><span class="small">minutes</span></div>
    </div>
    <p class="when" id="whenLine"></p>
    <div class="diagram" aria-hidden="true"><svg id="homeDiagram" viewBox="0 0 320 220"></svg></div>
    <button class="begin" type="button" id="beginBtn"><span id="beginText">Begin</span><span class="arrow">&#8595;</span></button>
    <div class="controls">
      <div class="ctl"><span class="caps small">Sit</span><div class="seg" id="slotSeg">
        <button type="button" id="slot-morning"><span class="sq"></span>Morning</button>
        <button type="button" id="slot-afternoon"><span class="sq"></span>Afternoon</button>
      </div></div>
      <div class="ctl"><span class="caps small">Length</span><div class="seg">
        <button type="button" id="len-10">10</button><button type="button" id="len-15">15</button><button type="button" id="len-20">20</button>
      </div></div>
    </div>
    <div class="teaching" id="teachBox"></div>
  </section>

  <section class="page view" id="view-guide" hidden aria-label="Guide">
    <div class="card" id="card" aria-live="polite"></div>
    <div class="guide-nav">
      <button type="button" id="gPrev">Back</button>
      <div class="ticks" id="gTicks"></div>
      <button type="button" id="gNext">Next</button>
    </div>
  </section>

  <section class="page view" id="view-practice" hidden>
    <h2>Practice</h2>
    <div class="mala-head"><b id="beadCount">0</b><p class="small" id="malaNote">of 108 beads. Each sit is one.</p></div>
    <div class="beads" id="beads" aria-label="Mala of 108 beads. Tap an open bead to read its lesson."></div>
    <div class="lesson" id="lessonBox" aria-live="polite"></div>
    <div class="figs">
      <div><b id="figThread">0</b><span class="small">day thread</span></div>
      <div><b id="figSits">0</b><span class="small">sits</span></div>
      <div><b id="figHours">0</b><span class="small">hours within</span></div>
    </div>
    <h3>Last three weeks</h3>
    <div class="grid-wrap"><div class="days" id="daysGrid" aria-label="Last three weeks. Top row morning, bottom row afternoon."></div></div>
    <div class="today-row" id="todayRow"></div>
    <h3>Your two times</h3>
    <div class="times">
      <label for="t-morning">Morning<input type="time" id="t-morning"></label>
      <label for="t-afternoon">Afternoon<input type="time" id="t-afternoon"></label>
    </div>
    <p class="small">Same chair, same hour, every day.</p>
    <h3>The catch</h3>
    <ul class="catch" id="catchList"></ul>
    <p class="small" id="syncLine">Opening…</p>
    <div class="row"><button class="outline" type="button" id="backupBtn">Save a backup</button><label class="outline" for="restoreFile" style="cursor:pointer">Restore</label><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>
    <p class="small" id="backupMsg"></p>
  </section>

  <section class="page view" id="view-music" hidden>
    <h2>Music</h2>
    <div class="tracks" id="tracks"></div>
    <div class="row"><button class="outline" type="button" id="previewBtn">Listen</button><input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Music volume"></div>
    <h3>During the sit</h3>
    <div role="group" aria-label="During the sit">
      <button class="choice" type="button" id="mode-fade"><span class="sq"></span><span>Fade to silence<small>Music while you settle and while you come out. TM itself is practised in silence.</small></span></button>
      <button class="choice" type="button" id="mode-through"><span class="sq"></span><span>Play all the way through<small>Softly, under the whole sit.</small></span></button>
    </div>
    <p class="credits" id="credits"></p>
  </section>
</main>

<nav class="nav" aria-label="Sections"><div class="nav-in">
  <a href="#" id="nav-home">Sit</a>
  <a href="#guide" id="nav-guide">Guide</a>
  <a href="#practice" id="nav-practice">Practice</a>
  <a href="#music" id="nav-music">Music</a>
</div></nav>

<div class="session" id="session" hidden role="dialog" aria-modal="true" aria-label="Sitting">
  <div class="inner">
    <div class="head"><span id="sPhase"></span><span id="sClock"></span></div>
  </div>
  <div class="inner">
    <div class="diagram" id="sDiagramWrap" aria-hidden="true"><svg id="sDiagram" viewBox="0 0 320 220"></svg></div>
    <p class="words" id="sWords"></p>
    <div class="after" id="sAfter" hidden>
      <div class="bead-line"><b id="beadBig"></b><span class="small" id="beadOf"></span></div>
      <p class="gift" id="giftLine"></p>
      <label for="fishNote" id="fishLabel">Did anything surface? An idea, an image. Optional.</label>
      <textarea id="fishNote" maxlength="600"></textarea>
      <button class="solid" type="button" id="saveBtn">Keep it</button>
    </div>
  </div>
  <div class="inner">
    <div class="s-actions" id="sActions"><button type="button" id="peekBtn">Show time</button><span id="endArea"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------- content ----------------
  var TRACKS = [
    { id: "peaceful", name: "Peaceful Desolation", len: "1:31", file: "music/peaceful-desolation.mp3" },
    { id: "none", name: "Silence", len: "", file: null }
  ];
  var CREDITS = "Music by Kevin MacLeod (incompetech.com), licensed under Creative Commons Attribution (CC BY). From Wikimedia Commons, converted to MP3 for phones.";

  // 108 lessons in 9 chapters, one per bead. "After X" = paraphrase; a bare name = direct quote.
  var PATH = {"chapters": ["Beginning", "The ocean", "The big fish", "The suit", "Rest and activity", "Effortless", "Bliss within", "The work", "The unified field"], "lessons": [{"t": "The first bead", "b": "You\u2019ve started, which is the hardest part. Tomorrow, do the same thing at the same time. That\u2019s the whole plan.", "s": "Practice"}, {"t": "Twice", "b": "The morning sit clears the night. The afternoon sit clears the day. Two short dips, every day, is the rhythm Maharishi taught.", "s": "After Maharishi"}, {"t": "Same chair", "b": "A habit attaches to a place and an hour. Use the same chair at the same times, and the sitting starts to begin before you do.", "s": "Practice"}, {"t": "Not concentration", "b": "Concentration holds the mind on the surface. Meditation lets go of the surface so the mind can settle by itself.", "s": "After Maharishi"}, {"t": "Thoughts are allowed", "b": "You will think during a sit. Everyone does. Thoughts are not a mistake; they\u2019re part of how the mind settles.", "s": "Practice"}, {"t": "A sound, not a meaning", "b": "The sound is used for its sound, not its meaning. Meaning keeps the mind busy on the surface. A sound can grow faint and carry you down.", "s": "After Maharishi"}, {"t": "Coming back", "b": "Noticing you\u2019ve drifted is part of the practice, not a failure of it. Come back to the sound the way you\u2019d pick up a pen you dropped. No scolding.", "s": "Practice"}, {"t": "Falling asleep", "b": "If you fall asleep, the body needed it. When you wake, sit a few more minutes with the sound before coming out.", "s": "Practice"}, {"t": "Before food", "b": "Digestion and deep rest compete. Sit before breakfast and before dinner, not after.", "s": "Practice"}, {"t": "Two minutes", "b": "Coming out slowly is part of the sit. Jumping up straight away can leave you groggy or irritable for an hour.", "s": "Practice"}, {"t": "Day one", "b": "David Lynch learned in 1973 and said for decades afterwards that he hadn\u2019t missed a single sit. Every one of those decades started with a first week like this one.", "s": "On Lynch"}, {"t": "Learn it properly", "b": "TM is taught in person by a certified teacher, with a personal sound and checking. Lynch was firm about it: learn from a teacher. This app is the chair and the clock until then.", "s": "Practice"}, {"t": "Surface and depth", "b": "Maharishi described the mind as an ocean. Waves and noise at the top. Lower down, quieter. At the bottom, still.", "s": "After Maharishi"}, {"t": "Bubbles", "b": "A thought starts as a tiny bubble deep down and grows as it rises, until you notice it at the surface. Meditation follows the bubble back down.", "s": "After Maharishi"}, {"t": "Finer levels", "b": "As you go deeper, the sound gets fainter and finer. That fading is the dive. You\u2019re experiencing thought at quieter stages.", "s": "After Maharishi"}, {"t": "The source", "b": "Beneath the finest thought there\u2019s a level with no thought at all, only awareness. Going beyond thought is what transcending means.", "s": "After Maharishi"}, {"t": "The fourth state", "b": "We know waking, dreaming and deep sleep. Maharishi taught there is a fourth: awake inside, with nothing to be awake to. Transcendental consciousness.", "s": "After Maharishi"}, {"t": "Restful alertness", "b": "In that state the body rests very deeply while the mind stays awake. Maharishi called it restful alertness. It\u2019s the opposite of being tired and wired.", "s": "After Maharishi"}, {"t": "You may not notice", "b": "Transcending is often noticed only afterwards, as a gap: time passed and you can\u2019t say where you were. That gap is not sleep.", "s": "Practice"}, {"t": "Charm", "b": "The mind moves toward what\u2019s more charming. Quieter levels are more charming than the surface, so the mind goes down on its own if you let it.", "s": "After Maharishi"}, {"t": "The diver", "b": "A diver doesn\u2019t swim to the bottom. They take the right angle and let go. The sound is the angle; letting go is the rest.", "s": "After Maharishi"}, {"t": "Water the root", "b": "\u201cWater the root to enjoy the fruit.\u201d Don\u2019t fix every leaf of your life one by one. Go to the root, and the whole tree benefits.", "s": "Maharishi Mahesh Yogi"}, {"t": "Wave and ocean", "b": "A wave looks separate, but it is the ocean moving. Maharishi taught that the individual mind is like that: a wave on an unbounded ocean of consciousness.", "s": "After Maharishi"}, {"t": "Guru Dev", "b": "Maharishi learned from his own teacher, Swami Brahmananda Saraswati, whom he called Guru Dev. He credited everything he taught to him.", "s": "On Maharishi"}, {"t": "Ideas are like fish", "b": "\u201cIdeas are like fish. If you want to catch little fish, you can stay in the shallow water. But if you want to catch the big fish, you\u2019ve got to go deeper.\u201d", "s": "David Lynch"}, {"t": "Desire is the bait", "b": "Lynch said wanting an idea is the bait. Think about what you want to make, and ideas start to come to the hook.", "s": "After Lynch"}, {"t": "Write it down", "b": "When a fish bites, catch it. Write it down at once, however small. Lynch kept the idea; the idea told him the rest.", "s": "After Lynch"}, {"t": "Fragments", "b": "Often you catch only a fragment: a mood, a sound, one image. Lynch said a fragment attracts other fish. Keep it and more will come.", "s": "After Lynch"}, {"t": "Fall in love", "b": "Lynch said you know an idea is right when you fall in love with it. Not approve of it. Fall in love.", "s": "After Lynch"}, {"t": "Stay true", "b": "Once you have an idea you love, every decision after that gets checked against it. Lynch called that staying true to the idea.", "s": "After Lynch"}, {"t": "The milkshake", "b": "For years Lynch went to Bob\u2019s Big Boy every afternoon for a chocolate shake and sat writing ideas on napkins. A place, a time, a habit of catching.", "s": "On Lynch"}, {"t": "Daydreaming", "b": "Ideas come into open space. Let the mind wander sometimes. Lynch protected time to just sit and think.", "s": "After Lynch"}, {"t": "Intuition", "b": "Lynch called intuition the key: feeling and intellect working together. He believed meditation sharpens it.", "s": "After Lynch"}, {"t": "Deeper water", "b": "The bigger, more abstract ideas swim deeper. The quieter you can get, the more of them you meet.", "s": "After Lynch"}, {"t": "Keep a net nearby", "b": "Keep paper by your chair. Ideas often surface in the two minutes of coming up, or an hour later on a walk.", "s": "Practice"}, {"t": "Not every sit", "b": "Not every sit brings a fish. Meditation changes the water. The catching happens through the day.", "s": "Practice"}, {"t": "Negativity", "b": "\u201cNegativity is the enemy of creativity.\u201d", "s": "David Lynch"}, {"t": "The rubber suit", "b": "Lynch described anger, fear and depression as a tight rubber clown suit you can\u2019t take off. Meditation, he said, starts to dissolve it from the inside.", "s": "After Lynch"}, {"t": "Stress comes out", "b": "Deep rest lets the body release old stress. Maharishi taught that this can show up during a sit as busy thoughts or restlessness.", "s": "After Maharishi"}, {"t": "Busy sits count", "b": "A busy sit is not a bad sit. It may be one of the useful ones: something leaving.", "s": "Practice"}, {"t": "No need to suffer", "b": "Lynch rejected the idea that artists must suffer. Suffering, he said, only makes the work harder. A clear mind catches more.", "s": "After Lynch"}, {"t": "Show it, don\u2019t live it", "b": "Lynch\u2019s films go into very dark places. He said you can show suffering without suffering yourself.", "s": "After Lynch"}, {"t": "Dark and light", "b": "Lynch wasn\u2019t afraid of darkness in his work. The more settled he was inside, the further he could look into it without being swallowed.", "s": "After Lynch"}, {"t": "Grumpy afterwards", "b": "If you feel irritable after a sit, you probably came out too fast. Take the full two minutes.", "s": "Practice"}, {"t": "Not pushing away", "b": "TM doesn\u2019t suppress feelings or argue with them. It lets them settle, the way silt settles in still water.", "s": "After Maharishi"}, {"t": "Tiredness", "b": "Feeling tired in sits is common at the start. The body is catching up on rest it has been owed for a while.", "s": "Practice"}, {"t": "No grades", "b": "Don\u2019t score your sits. Deep, shallow, busy, sleepy: you showed up, and that\u2019s the part you control.", "s": "Practice"}, {"t": "The suit thins", "b": "The change is gradual. Often other people notice it before you do.", "s": "Practice"}, {"t": "The bow", "b": "To send an arrow far, you pull it back first. Meditation is the pulling back; your day is the flight.", "s": "After Maharishi"}, {"t": "The cloth", "b": "Old Indian dyers dipped cloth in colour, let the sun fade it, then dipped it again. After enough rounds the colour stays. Twice a day is the dipping.", "s": "After Maharishi"}, {"t": "Rest, then act", "b": "Maharishi taught that rest is the basis of activity. Good action comes out of good rest, not instead of it.", "s": "After Maharishi"}, {"t": "Established, then act", "b": "Maharishi often returned to a line from the Bhagavad Gita: become established in Being, then perform action.", "s": "After Maharishi"}, {"t": "Go in to come out", "b": "Meditation isn\u2019t an escape from life. You go in so you can come out and live more fully.", "s": "After Maharishi"}, {"t": "A busy monk", "b": "Maharishi wasn\u2019t a hermit. He travelled the world for decades, teaching and building schools. Silence inside, a lot of activity outside.", "s": "On Maharishi"}, {"t": "The morning sit", "b": "The morning sit sets the tone. Do your most important work in the hours right after it.", "s": "Practice"}, {"t": "The afternoon sit", "b": "By late afternoon the day has piled up. The second sit clears it, so the evening belongs to you.", "s": "Practice"}, {"t": "On set", "b": "Lynch kept both sits through long film shoots, fitting them around the work. If he could, you can fit them around a Tuesday.", "s": "On Lynch"}, {"t": "Twenty, not two hundred", "b": "More isn\u2019t better. The time is fixed at about twenty minutes. The benefit comes from the rhythm, not the length.", "s": "Practice"}, {"t": "Judge by your days", "b": "Maharishi said the results of meditation show in activity. Don\u2019t judge by how a sit felt. Judge by how your weeks go.", "s": "After Maharishi"}, {"t": "Less friction", "b": "Maharishi taught that action from a settled mind meets less resistance. He called it the support of nature.", "s": "After Maharishi"}, {"t": "Effortless", "b": "If you\u2019re trying, ease off. Effort keeps you at the surface. The less you do, the deeper you go.", "s": "After Maharishi"}, {"t": "No control", "b": "You\u2019re not steering. You start the sound, and the mind finds its own way down.", "s": "Practice"}, {"t": "Innocently", "b": "Maharishi stressed innocence: take whatever happens as it comes, with no agenda for the sit.", "s": "After Maharishi"}, {"t": "No expectations", "b": "Expecting a deep sit is the fastest way to have a busy one. Sit as if it\u2019s the first time.", "s": "Practice"}, {"t": "The pull", "b": "Happiness pulls the mind the way a slope pulls water. You don\u2019t need to push water downhill.", "s": "After Maharishi"}, {"t": "Hold it loosely", "b": "Don\u2019t grip the sound. Let it be there the way the hum of a fridge is there.", "s": "Practice"}, {"t": "It changes", "b": "The sound may speed up, slow down, blur or vanish. All of that is fine. When you notice it has gone, gently return.", "s": "Practice"}, {"t": "Both at once", "b": "You can have thoughts and the sound at the same time. No need to choose.", "s": "Practice"}, {"t": "Noise", "b": "Traffic, a dog, a neighbour. Treat outside noise like a thought: notice it, and come back easily.", "s": "Practice"}, {"t": "The body", "b": "An itch, a twitch, a warmth. Let your attention rest there for a moment if it wants to, then return to the sound.", "s": "Practice"}, {"t": "No belief needed", "b": "TM doesn\u2019t ask you to believe anything. Lynch was clear that it isn\u2019t a religion. It works the same if you\u2019re a sceptic.", "s": "After Lynch"}, {"t": "Simple", "b": "Maharishi called it simple and natural. The only way to get it wrong is to make it complicated.", "s": "After Maharishi"}, {"t": "Happiness within", "b": "Lynch said real happiness isn\u2019t out there in things. It\u2019s within, and meditation is the way to it.", "s": "After Lynch"}, {"t": "Bliss", "b": "Maharishi called the source bliss consciousness. You don\u2019t make it; you visit it, twice a day.", "s": "After Maharishi"}, {"t": "Not a struggle", "b": "Maharishi taught that life isn\u2019t meant to be a struggle. It\u2019s meant to be lived in fullness and joy.", "s": "After Maharishi"}, {"t": "Unbounded", "b": "Lynch described the deepest level as unbounded: no edges, no end. You can\u2019t picture it. You can visit it.", "s": "After Lynch"}, {"t": "The golf ball", "b": "Lynch said if your awareness is the size of a golf ball, you understand a book at golf-ball size. Expand awareness and everything you meet gets bigger.", "s": "After Lynch"}, {"t": "Quiet joy", "b": "Bliss here doesn\u2019t mean excitement. It\u2019s more like contentment with no reason attached.", "s": "Practice"}, {"t": "The world is as we are", "b": "Maharishi often said that the world we see reflects the state we\u2019re in. Change the seer, and the seen changes.", "s": "After Maharishi"}, {"t": "Forty days", "b": "Around now you\u2019ve practised for forty days. Many traditions treat forty days as a full cycle of practice.", "s": "Practice"}, {"t": "Small signs", "b": "Watch for small changes: a little more patience, better sleep, a beat of space before you react.", "s": "Practice"}, {"t": "It spreads", "b": "When you\u2019re more settled, the people around you feel it, usually before anyone says so.", "s": "Practice"}, {"t": "The giggling guru", "b": "Newspapers called Maharishi \u201cthe giggling guru\u201d because he laughed so easily. Depth doesn\u2019t have to be solemn.", "s": "On Maharishi"}, {"t": "Lightness", "b": "Lynch, who made some of the darkest films of his time, also gave cheerful daily weather reports from Los Angeles and drew the day\u2019s number. Depth and lightness together.", "s": "On Lynch"}, {"t": "The art life", "b": "As a young man Lynch decided he wanted to live \u201cthe art life\u201d: coffee, painting, working on ideas. He kept that life for good.", "s": "On Lynch"}, {"t": "A painting that moves", "b": "Lynch started as a painter. He wanted his paintings to move and make sound, and that\u2019s how he came to film.", "s": "On Lynch"}, {"t": "Five years", "b": "Lynch\u2019s first feature, Eraserhead, took about five years to make. Big fish don\u2019t come in a hurry.", "s": "On Lynch"}, {"t": "Best hours", "b": "Put your hardest work right after your morning sit, while the water is still clear.", "s": "Practice"}, {"t": "Mood", "b": "Lynch talked about the mood of a place as much as its look. A settled mind notices more of it.", "s": "After Lynch"}, {"t": "Give ideas a home", "b": "A notebook, a voice memo, a wall of cards. An idea without a home gets lost.", "s": "Practice"}, {"t": "Protect the idea", "b": "Lynch said his worst experience was a film where he didn\u2019t have the final say. Protect the idea you fell in love with.", "s": "After Lynch"}, {"t": "Give it away", "b": "In 2005 Lynch started a foundation to teach TM to students, veterans and people under stress. He spent a lot of his later life on it.", "s": "On Lynch"}, {"t": "Knowledge and consciousness", "b": "The university Maharishi founded took as its motto: knowledge is structured in consciousness. What you can know depends on the state you know it in.", "s": "On Maharishi"}, {"t": "Do less, accomplish more", "b": "Maharishi taught a principle he called doing less and accomplishing more. Rest well, then act precisely.", "s": "After Maharishi"}, {"t": "Your field", "b": "Whatever your work is, it\u2019s the same idea: go deeper, catch something, bring it up, make it real.", "s": "Practice"}, {"t": "Rest before deciding", "b": "When a big decision comes, sit first. The answer that rises afterwards is usually the clearer one.", "s": "Practice"}, {"t": "The unified field", "b": "Lynch and Maharishi both linked the source of thought with the unified field that physicists look for beneath all forces. That\u2019s their view, and it\u2019s a big one: the bottom of the mind and the bottom of nature are the same.", "s": "After Lynch and Maharishi"}, {"t": "One ocean", "b": "If every wave is the ocean, then every mind touches the same depth. That\u2019s what Maharishi meant by unity.", "s": "After Maharishi"}, {"t": "Seven states", "b": "Maharishi described seven states of consciousness: waking, dreaming, deep sleep, transcendental consciousness, and three more that grow from regular practice.", "s": "After Maharishi"}, {"t": "Cosmic consciousness", "b": "The fifth: the inner silence you touch in meditation stays with you during activity, even through sleep. Maharishi called it cosmic consciousness.", "s": "After Maharishi"}, {"t": "Refined perception", "b": "The sixth: the world starts to look finer and more beautiful, perceived in more detail. Maharishi called it God consciousness.", "s": "After Maharishi"}, {"t": "Unity", "b": "The seventh: everything is seen as the same field you met at the bottom of the ocean. Maharishi called it unity consciousness.", "s": "After Maharishi"}, {"t": "Not a ladder", "b": "Don\u2019t chase these states. Chasing is effort, and effort keeps you at the surface. They grow by themselves.", "s": "Practice"}, {"t": "Together", "b": "Maharishi believed that many people meditating together could calm a whole society. It\u2019s a debated idea. The smaller version is certain: a calmer you changes the room you\u2019re in.", "s": "After Maharishi"}, {"t": "Peace", "b": "Lynch thought real peace means more than the absence of war. He believed it starts inside individual people, one at a time.", "s": "After Lynch"}, {"t": "Rishikesh", "b": "In 1968 the Beatles spent weeks with Maharishi in Rishikesh, India, and wrote many of their songs there. Ideas surface in quiet places.", "s": "On Maharishi"}, {"t": "Fifty years", "b": "Lynch meditated twice a day for more than fifty years, until he died in January 2025. The practice was the constant under everything he made.", "s": "On Lynch"}, {"t": "The whole mala", "b": "108 dives. A mala is a circle, so the next bead starts it again. The lessons will read differently the second time, because you will be different.", "s": "Practice"}]};

  ["morning", "afternoon"].forEach(function (s) { $("slot-" + s).onclick = function () { ui.slot = s; ui.confirmClear = false; render(); }; });
  [10, 15, 20].forEach(function (d) { $("len-" + d).onclick = function () { ui.dur = d; lsSet("dive.dur", d); render(); }; });
  $("beginBtn").onclick = begin;
  $("peekBtn").onclick = function () { if (S) { S.peek = !S.peek; tick(); wake(); } };
  $("saveBtn").onclick = saveAndClose;
  $("session").addEventListener("pointerdown", function () { if (S && S.phase !== "done") wake(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { if (S && S.phase !== "done") { keepAwake(); tick(); animate(); } else render(); }
  });
  setInterval(function () { if (!S) render(); }, 60000);


  // ---------------- backup ----------------
  $("backupBtn").onclick = function () {
    var data = { app: "dive-within", version: 1, exported: new Date().toISOString(), times: times(), days: store.days };
    var name = "dive-within-backup-" + todayKey() + ".json";
    var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    try {
      var file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Dive Within backup" }).then(function () { $("backupMsg").textContent = "Backup saved."; }).catch(function () {});
        return;
      }
    } catch (e) {}
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    $("backupMsg").textContent = "Backup saved as " + name + ".";
  };
  $("restoreFile").addEventListener("change", function () {
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (!data || data.app !== "dive-within" || typeof data.days !== "object") throw new Error("not a backup");
        var merged = Object.assign({}, store.days), added = 0;
        Object.keys(data.days).forEach(function (k) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
          var mine = merged[k] || {}, theirs = data.days[k] || {}, out = Object.assign({}, mine);
          ["morning", "afternoon"].forEach(function (s) {
            if (theirs[s] && theirs[s].done && !(mine[s] && mine[s].done)) { out[s] = theirs[s]; added++; }
          });
          out.date = k; merged[k] = out;
        });
        store.days = merged; lsSet("dive.days", merged);
        if (data.times && data.times.morning) saveTimes(data.times);
        $("backupMsg").textContent = "Restored. " + added + " sit" + (added === 1 ? "" : "s") + " added.";
        render();
      } catch (e) { $("backupMsg").textContent = "That file isn’t a Dive Within backup."; }
    };
    r.readAsText(f); this.value = "";
  });

  // ---------------- standalone extras ----------------
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  setInterval(function () { if (themeMeta) themeMeta.setAttribute("content", getComputedStyle(document.body).backgroundColor); }, 2000);

  if (!lsGet("dive.guided", false) && !location.hash) location.hash = "guide";
  showView();
  init();
})();
</script>
</body>
</html>
